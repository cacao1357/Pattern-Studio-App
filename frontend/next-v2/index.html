<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta
      name="description"
      content="纹样工作台 —— 本地优先的纹样提取与矢量化工具：上传、裁切、提取、矢量化、蒙版、平铺与导出，数据保存在本机。"
    />
    <title>纹样工作台</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./css/tokens.css" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/shell.css" />
    <link rel="stylesheet" href="./css/home.css" />
    <link rel="stylesheet" href="./css/workbench.css" />
    <link rel="stylesheet" href="./css/library.css" />
    <link rel="stylesheet" href="./css/settings.css" />
    <link rel="stylesheet" href="./css/notes.css" />
  </head>
  <body>
    <a class="skip-link" href="#view">跳到主要内容</a>
    <div class="route-progress" id="route-progress" aria-hidden="true"></div>
    <div class="ambient" aria-hidden="true"></div>

    <div class="app">
      <header class="topbar" id="topbar">
        <a class="brand" href="#/home" aria-label="纹样工作台首页">
          <span class="brand__seal" aria-hidden="true">
            <svg class="icon"><use href="#i-mark"></use></svg>
          </span>
          <span class="brand__name">纹样工作台</span>
        </a>

        <nav class="topnav" aria-label="主导航">
          <a class="topnav__link" href="#/home" data-nav="home">首页</a>
          <a class="topnav__link" href="#/workbench" data-nav="workbench">工作台</a>
          <a class="topnav__link" href="#/library" data-nav="library">纹样库</a>
          <a class="topnav__link" href="#/settings" data-nav="settings">设置</a>
        </nav>

        <div class="topbar__right">
          <span class="svc" title="本机服务状态">
            <span class="svc__dot" aria-hidden="true"></span>
            本机服务就绪
          </span>
          <button class="cmdk-trigger" type="button" data-open-cmdk aria-label="命令 Ctrl K，打开命令面板">
            <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
            命令
            <span class="kbd">Ctrl K</span>
          </button>
          <button class="btn btn--quiet btn--sm" type="button" data-action="notes">使用说明</button>
          <button class="btn btn--primary btn--sm" type="button" data-action="upload" data-magnetic>
            <svg class="icon" aria-hidden="true"><use href="#i-upload"></use></svg>
            上传纹样
          </button>
        </div>
      </header>

      <main class="view" id="view" tabindex="-1"></main>

      <footer class="statusbar" id="statusbar" aria-label="状态"></footer>
    </div>

    <div class="toast-stack" id="toasts" aria-live="polite" aria-atomic="false"></div>

    <div class="cmdk" id="cmdk" role="dialog" aria-modal="true" aria-label="命令面板" aria-hidden="true">
      <div class="cmdk__panel">
        <div class="cmdk__search">
          <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
          <input
            class="cmdk__input"
            id="cmdk-input"
            type="text"
            name="cmdk-query"
            placeholder="搜索页面、工序或操作…"
            autocomplete="off"
            spellcheck="false"
            aria-label="搜索命令"
          />
          <span class="cmdk__esc">Esc</span>
        </div>
        <div class="cmdk__list" id="cmdk-list"></div>
        <div class="cmdk__foot">
          <span><span class="kbd">↑</span><span class="kbd">↓</span> 选择</span>
          <span><span class="kbd">Enter</span> 执行</span>
          <span><span class="kbd">Esc</span> 关闭</span>
        </div>
      </div>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
