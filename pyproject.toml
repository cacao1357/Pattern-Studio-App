[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pattern-studio"
version = "0.2.0"
description = "Local pattern extraction and vectorization workbench"
requires-python = ">=3.11,<3.12"
dependencies = [
  "Pillow==13.0.0",
  "numpy==2.4.6",
  "opencv-python==5.0.0.93",
  "vtracer==0.6.15",
  "pydantic==2.14.1",
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "uvicorn==0.54.0",
  "python-dotenv==1.2.4",
  "python-multipart==0.0.32",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[project.optional-dependencies]
dev = ["pytest>=8"]
leftrefill = [
  "diffusers==0.35.2",
  "transformers==4.49.0",
  "safetensors>=0.5.3,<1",
  "accelerate==1.4.0",
]
