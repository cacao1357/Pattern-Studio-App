    <link rel="icon" href="../../frontend/next-v2/assets/favicon.svg" type="image/svg+xml" />

    <div class="app" id="app">
      <aside class="rail" aria-label="主导航">
        <a class="rail__brand" href="#/home" aria-label="纹样工作台">
          <span class="seal">纹</span>
        </a>
        <nav class="rail__nav">
          <a class="rail__link" href="#/home" data-nav="home"><svg class="ic"><use href="#i-home"/></svg><span>概览</span></a>
          <a class="rail__link" href="#/workbench" data-nav="workbench"><svg class="ic"><use href="#i-bench"/></svg><span>工作台</span></a>
          <a class="rail__link" href="#/library" data-nav="library"><svg class="ic"><use href="#i-library"/></svg><span>纹样库</span></a>
          <a class="rail__link" href="#/batch" data-nav="batch"><svg class="ic"><use href="#i-batch"/></svg><span>批量</span><i class="rail__badge" data-badge="batch">1</i></a>
          <a class="rail__link" href="#/tasks" data-nav="tasks"><svg class="ic"><use href="#i-tasks"/></svg><span>任务</span><i class="rail__badge" data-badge="tasks">2</i></a>
          <a class="rail__link" href="#/settings" data-nav="settings"><svg class="ic"><use href="#i-settings"/></svg><span>设置</span></a>
          <a class="rail__link" href="#/notes" data-nav="notes"><svg class="ic"><use href="#i-notes"/></svg><span>说明</span></a>
        </nav>
        <div class="rail__foot">
          <button class="rail__theme rail__cmd" type="button" data-act="cmd-open" title="命令面板（Ctrl / ⌘ + K）">
            <svg class="ic"><use href="#i-search"/></svg>
          </button>
          <button class="rail__theme" type="button" data-act="theme" title="切换宣纸 / 夜墨">
            <svg class="ic ic--sun"><use href="#i-sun"/></svg>
            <svg class="ic ic--moon"><use href="#i-moon"/></svg>
          </button>
          <span class="rail__svc" title="本机服务就绪"><i></i></span>
          <span class="rail__demo" title="交互模板 · 演示数据 · 未接入服务">演示</span>
        </div>
      </aside>

      <main class="view" id="view" tabindex="-1"></main>
    </div>

    <div class="drawer-scrim" id="scrim" data-act="close-drawer"></div>
    <aside class="drawer" id="drawer" aria-hidden="true" aria-label="详情"></aside>

    <div class="modal-scrim" id="modal-scrim" data-act="close-modal"></div>
    <section class="modal" id="modal" role="dialog" aria-modal="true" aria-hidden="true" aria-label="对话框"></section>

    <div class="cmdk-scrim" id="cmd-scrim" data-act="cmd-close"></div>
    <section class="cmdk" id="cmdk" role="dialog" aria-modal="true" aria-hidden="true" aria-label="命令面板">
      <div class="cmdk__bar">
        <svg class="ic"><use href="#i-search"/></svg>
        <input id="cmd-input" class="input" type="text" placeholder="搜索页面、工序或操作…" autocomplete="off" spellcheck="false" />
        <span class="kbd">Esc</span>
      </div>
      <div class="cmdk__list" id="cmd-list"></div>
    </section>

    <div class="menu" id="menu" hidden></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script src="./js/data.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/views-home.js"></script>
    <script src="./js/views-workbench.js"></script>
    <script src="./js/views-library.js"></script>
    <script src="./js/views-batch.js"></script>
    <script src="./js/views-tasks.js"></script>
    <script src="./js/views-settings.js"></script>
    <script src="./js/views-notes.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
